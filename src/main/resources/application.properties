# Application Mode: web, worker, all
ingsis.app.mode=${APP_MODE:all}

# Redis Streams Configuration
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
ingsis.redis.stream.tasks=${REDIS_STREAM_TASKS:tasks:printscript}
ingsis.redis.stream.results=${REDIS_STREAM_RESULTS:tasks:results}
ingsis.redis.stream.group=${REDIS_STREAM_GROUP:language-workers}
ingsis.redis.stream.consumer=${REDIS_STREAM_CONSUMER:worker-1}

# In test profile, run in web mode so background worker doesn't attempt to connect to Redis
%test.ingsis.app.mode=web
