# Application Mode: web, worker, all
ingsis.app.mode=${APP_MODE:all}

# Redis Streams Configuration
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
ingsis.redis.stream.tasks=${REDIS_STREAM_TASKS:tasks:printscript}
ingsis.redis.stream.results=${REDIS_STREAM_RESULTS:tasks:results}
ingsis.redis.stream.group=${REDIS_STREAM_GROUP:language-workers}
ingsis.redis.stream.consumer=${REDIS_STREAM_CONSUMER:}
ingsis.redis.max-attempts=${REDIS_MAX_ATTEMPTS:3}
ingsis.redis.claim-idle-ms=${REDIS_CLAIM_IDLE_MS:60000}

# Interactive execution over WebSocket
ingsis.execution.input-timeout-seconds=${EXECUTION_INPUT_TIMEOUT:60}
ingsis.execution.max-duration-seconds=${EXECUTION_MAX_DURATION:300}
ingsis.execution.max-sessions=${EXECUTION_MAX_SESSIONS:8}
